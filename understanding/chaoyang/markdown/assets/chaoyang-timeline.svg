<text x="573.4" y="286.0" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="17.0" fill="#6b6a66" text-anchor="middle" font-weight="400">598 改龙城县为柳城</text>
<rect x="682.6" y="140" width="161.2" height="110" fill="#f0dcab"/>
<text x="763.2" y="205.0" font-family="'Noto Serif SC','Microsoft YaHei',serif" font-size="28.0" fill="#7a5c0e" text-anchor="middle" font-weight="700">兴中府</text>
<text x="763.2" y="286.0" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="17.0" fill="#6b6a66" text-anchor="middle" font-weight="400">1041 升为兴中府</text>
