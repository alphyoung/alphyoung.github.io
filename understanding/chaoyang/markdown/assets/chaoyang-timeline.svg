<text x="203.8" y="286.0" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="17.0" fill="#6b6a66" text-anchor="middle" font-weight="400">汉柳城 · 辽西边郡</text>
<rect x="337.6" y="140" width="126.7" height="110" fill="#f0dcab"/>
