<text x="911.8" y="355.0" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="15.5" fill="#6b6a66" text-anchor="middle" font-weight="400">明</text>
<line x1="979.8" y1="336" x2="979.8" y2="364" stroke="#ddd8c9" stroke-width="1"/>
<text x="1045.8" y="355.0" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="15.5" fill="#6b6a66" text-anchor="middle" font-weight="400">清</text>
<line x1="1111.8" y1="336" x2="1111.8" y2="364" stroke="#ddd8c9" stroke-width="1"/>
<text x="1140.9" y="355.0" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="15.5" fill="#6b6a66" text-anchor="middle" font-weight="400">今</text>
<text x="70.0" y="412.0" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="15.5" fill="#6b6a66" text-anchor="start" font-weight="400">灰色段表示城名与建置长期不定的时期；明代卫所内移后，此地长期处在长城内外之间。</text>
<text x="70.0" y="438.0" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="15.5" fill="#6b6a66" text-anchor="start" font-weight="400">段下年份为该段城名的起始（或改名）事件，均见正文；本图为示意，未按城址变迁逐一对应。</text>
</svg>