<text x="944.8" y="205.0" font-family="'Noto Serif SC','Microsoft YaHei',serif" font-size="28.0" fill="#6b6a66" text-anchor="middle" font-weight="700">明—清初</text>
<text x="944.8" y="286.0" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="17.0" fill="#6b6a66" text-anchor="middle" font-weight="400">卫所内移，建置不常</text>
