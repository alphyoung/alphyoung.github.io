<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="492" viewBox="0 0 1240 492">
<rect width="1240" height="492" fill="#fdfcf9"/>
<text x="70.0" y="58.0" font-family="'Noto Serif SC','Microsoft YaHei',serif" font-size="30.0" fill="#1a2d5a" text-anchor="start" font-weight="700">城名沿革：从柳城到朝阳</text>
<text x="70.0" y="86.0" font-family="'Microsoft YaHei','Noto Sans SC',sans-serif" font-size="15.5" fill="#2f3d58" text-anchor="start" font-weight="400">同一个地点在不同时期的通行名称；时间轴按年代等比绘制，城名与行政建置名并不总同步变化。</text>
<line x1="70" y1="104" x2="1170" y2="104" stroke="#c9a227" stroke-width="2"/>
